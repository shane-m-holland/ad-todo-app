# Docker Compose configuration optimized for GitHub Codespaces
# Usage: docker compose -f docker-compose.codespaces.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    networks:
      - todo
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d tododb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    network_mode: "host"
    environment:
      DATABASE_URL: postgresql+asyncpg://todouser:todopass@localhost/tododb
      ENVIRONMENT: development
      # Use Codespaces environment variables to dynamically construct CORS origins
      CORS_ORIGINS_STR: https://${CODESPACE_NAME}-3000.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev},http://localhost:3000
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "uv sync && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    environment:
      # Use Codespaces environment variables to dynamically construct backend URL
      NEXT_PUBLIC_API_URL: https://${CODESPACE_NAME}-8000.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  backend-venv:

networks:
  todo:
